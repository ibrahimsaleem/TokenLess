name: "TokenLess"
id: "tokenless"
package_library:
  module_file: "tokenwatch.py"
  class_name: "TokenWatch"
  legacy_names:
    - "TokenWatch"

version: "1.2.3"
description: >
  TokenLess is an open token-optimization hub: docs, training, guidelines, system prompts,
  and skill packs—plus the TokenWatch Python library (tokenwatch.py) for local LLM usage
  and cost tracking across OpenAI, Anthropic, Google, and more. Compare models, set budgets,
  estimate spend, and extend PROVIDER_PRICING for custom or gateway model ids.
  Zero third-party dependencies for the library; data stays local under .tokenwatch/, MIT licensed.

homepage: "https://github.com/ibrahimsaleem/TokenLess"
repository: "https://github.com/ibrahimsaleem/TokenLess"
source: "included"
required_env_vars: []
primary_credential: "None — TokenWatch runs locally with no API keys required"

runtime: "local"
execution: "python"

intellectual_property:
  license: "MIT"
  license_file: "LICENSE.md"
  copyright: "© 2026 Ibrahim Saleem"
  distribution: "clawhub-and-forks-allowed"
  source_code_access: "included"
  modification: "allowed"
  reverse_engineering: "allowed"

author:
  name: "Ibrahim Saleem"
  company: "Ibrahim Saleem"
  contact: "https://github.com/ibrahimsaleem"
  website: "https://github.com/ibrahimsaleem/TokenLess"

category: "developer-tools"
tags:
  - "tokenless"
  - "token-optimization"
  - "token-usage"
  - "cost-tracking"
  - "budget"
  - "context-window"
  - "openai"
  - "anthropic"
  - "gemini"
  - "optimization"
  - "monitoring"
  - "training"
  - "open-source"

pricing:
  model: "free"

dependencies:
  python: ">=3.9"
  packages: []
  note: "Zero external dependencies for tokenwatch.py. Pure Python standard library only."

security:
  data_retention: "local-only"
  data_flow: "no-external-calls"
  privacy_policy: "Usage data stays on your machine in .tokenwatch/ directory"
  terms_of_service: "MIT License"

capabilities:
  functions:
    - name: "recordUsage"
      description: "Record token usage from an API call with automatic cost calculation"
      parameters:
        model:
          type: "string"
          description: "Model name (e.g. claude-haiku-4-5-20251001, gpt-4o-mini, gemini-2.5-flash)"
          required: true
        input_tokens:
          type: "integer"
          description: "Number of input/prompt tokens used"
          required: true
        output_tokens:
          type: "integer"
          description: "Number of output/completion tokens used"
          required: true
        task_label:
          type: "string"
          description: "Optional label describing the task"
          required: false

    - name: "setBudget"
      description: "Set daily, weekly, monthly, or per-call spending budget thresholds"
      parameters:
        daily_usd:
          type: "number"
          description: "Max daily spend in USD"
          required: false
        weekly_usd:
          type: "number"
          description: "Max weekly spend in USD"
          required: false
        monthly_usd:
          type: "number"
          description: "Max monthly spend in USD"
          required: false
        per_call_usd:
          type: "number"
          description: "Max cost per single API call"
          required: false

    - name: "getSpend"
      description: "Get total spending for a time period"
      parameters:
        period:
          type: "string"
          description: "today, week, month, all, or YYYY-MM-DD"
          required: false

    - name: "getDashboard"
      description: "Display a formatted spending dashboard with budget status and optimization tips"

    - name: "compareModels"
      description: "Compare costs across known models for a given token count"
      parameters:
        input_tokens:
          type: "integer"
          required: true
        output_tokens:
          type: "integer"
          required: true

    - name: "getOptimizationSuggestions"
      description: "Analyze usage patterns and return actionable cost reduction suggestions"

    - name: "estimateCost"
      description: "Estimate cost before making an API call"
      parameters:
        model:
          type: "string"
          required: true
        input_tokens:
          type: "integer"
          required: true
        output_tokens:
          type: "integer"
          required: true

    - name: "exportReport"
      description: "Export full usage report to JSON file"

environment_variables: []

support:
  support_email: "https://github.com/ibrahimsaleem/TokenLess/issues"
  website: "https://github.com/ibrahimsaleem/TokenLess"
  github: "https://github.com/ibrahimsaleem/TokenLess"
  documentation: "README.md, SKILL.md, docs/, training/"
  response_time: "Community supported"

restrictions:
  - "None — MIT Licensed"

changelog:
  "1.2.3":
    - "✨ TokenLess hub: documentation, training paths, guidelines, system prompts, scripts, templates"
    - "✨ TokenWatch library (tokenwatch.py): usage tracking, budgets, model comparison, Anthropic/OpenAI hooks"
    - "✨ Pricing table extensible via PROVIDER_PRICING"
    - "✨ Budget alerts: daily, weekly, monthly, per-call"
    - "✨ Optimization suggestions with estimated savings"
    - "✨ Local-only storage, zero pip dependencies for the library, MIT licensed"
    - "📦 Manifest renamed to tokenless-manifest.yaml (copy to manifest.yaml if your marketplace requires that filename)"

metadata:
  status: "active"
  created_at: "2026-02-16T00:00:00Z"
  updated_at: "2026-05-04T00:00:00Z"
  maturity: "production"
  maintenance: "community-maintained"
  required_credentials: "None"
  compatibility:
    - "Claude Code (skill install via SKILL.md)"
    - "Windsurf / Cascade (skills under skills/)"
    - "Any agent layout using Markdown skills"
