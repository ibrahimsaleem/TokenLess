# proxy_config.yaml — LiteLLM Proxy Server configuration
#
# Run the proxy:  litellm --config proxy_config.yaml --port 4000
# Then any OpenAI SDK app can point at http://localhost:4000 and
# the proxy will route requests to the right provider with all
# the features below enabled server-side.
#
# Docs: https://docs.litellm.ai/docs/proxy/quick_start

# ── Models exposed by the proxy ───────────────────────────────────────────────
model_list:
  - model_name: claude-haiku        # alias callers use
    litellm_params:
      model: claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Free local model via Ollama (install: https://ollama.ai)
  - model_name: local-mistral
    litellm_params:
      model: ollama/mistral
      api_base: http://localhost:11434

# ── Routing: load-balance or fallback between models ─────────────────────────
router_settings:
  routing_strategy: simple-shuffle   # or: least-busy, latency-based, cost-based
  num_retries: 2
  fallbacks:
    - claude-haiku:
        - gpt-4o-mini                # fall back to OpenAI if Anthropic is down

# ── Caching (server-side) ─────────────────────────────────────────────────────
litellm_settings:
  cache: true
  cache_params:
    type: local                      # options: local | redis | s3
    # For Redis (production):
    # type: redis
    # host: localhost
    # port: 6379
    # password: ""
    # ttl: 600                       # seconds

  # Token-level cost tracking
  success_callback: []
  failure_callback: []

  # Spend tracking per virtual key / team
  drop_params: false
  set_verbose: false

# ── Budget enforcement ────────────────────────────────────────────────────────
general_settings:
  master_key: sk-tokenless-proxy     # change this in production!
  database_connection_pool_limit: 10

  # Enforce max spend per API key at the proxy level
  # budget_duration: "1d"
  # max_budget: 5.00                 # USD per day for all calls through this proxy

# ── Guardrails hook (custom pre-flight checks) ────────────────────────────────
# The proxy calls these Python functions before forwarding each request.
# Uncomment and point at your guardrails module once you're running proxy mode:
#
# callbacks:
#   - custom_callback_compatible_class: guardrails.ProxyGuardrailCallback

# ── Logging ───────────────────────────────────────────────────────────────────
# litellm_settings:
#   success_callback: ["langfuse"]  # or: datadog, prometheus, s3
#   langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
#   langfuse_secret_key: os.environ/LANGFUSE_SECRET_KEY
